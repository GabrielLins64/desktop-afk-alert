name: desktop-afk-alert
arch: amd64
platform: linux
version: ${VERSION}
release: 2
section: utils
priority: optional
maintainer: desktop-afk-alert contributors
description: |
  Keep your desktop visible and warn unexpected visitors.
  A Matrix-inspired desktop guard with camera snapshots, Discord and Telegram
  alerts, and optional shutdown. Designed for GNOME and KDE on X11 and Wayland.
license: MIT
contents:
  - src: build/gui/gui_entry.dist/
    dst: /opt/desktop-afk-alert/gui
    type: tree
    file_info:
      owner: root
      group: root
  - src: build/helper/helper_entry.dist/
    dst: /opt/desktop-afk-alert/helper
    type: tree
    file_info:
      owner: root
      group: root
  - src: packaging/desktop-afk-alert
    dst: /usr/bin/desktop-afk-alert
    file_info:
      mode: 0755
  - src: packaging/desktop-afk-alert-helper
    dst: /usr/libexec/desktop-afk-alert-helper
    file_info:
      mode: 0755
  - src: resources/desktop-afk-alert.desktop
    dst: /usr/share/applications/desktop-afk-alert.desktop
    file_info:
      mode: 0644
  - src: resources/desktop-afk-alert.svg
    dst: /usr/share/icons/hicolor/scalable/apps/desktop-afk-alert.svg
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/desktop-afk-alert/LICENSE
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/desktop-afk-alert/copyright
    file_info:
      mode: 0644
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libstdc++6
      - libgl1
      - libegl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libxcb1
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-render-util0
      - libxcb-xkb1
      - libxcb-shape0
      - libxrandr2
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libpulse0
      - libasound2t64 | libasound2
      - libpam0g
      - libudev1
      - libdbus-1-3
      - libfontconfig1
      - libfreetype6
      - libglib2.0-0t64 | libglib2.0-0
      - libgssapi-krb5-2
      - sudo
      - systemd
      - xdg-desktop-portal
      - dbus-user-session
      - fonts-dejavu-core
    recommends:
      - xdg-desktop-portal-gnome | xdg-desktop-portal-kde
      - gnome-keyring | kwallet6
  rpm:
    depends:
      - glibc >= 2.35
      - libstdc++
      - libglvnd-glx
      - libglvnd-egl
      - libxkbcommon
      - libxkbcommon-x11
      - libxcb
      - xcb-util-cursor
      - xcb-util-image
      - xcb-util-keysyms
      - xcb-util-renderutil
      - xcb-util-wm
      - libwayland-client.so.0()(64bit)
      - libwayland-cursor.so.0()(64bit)
      - libwayland-egl.so.1()(64bit)
      - pulseaudio-libs
      - alsa-lib
      - pam
      - systemd-libs
      - dbus-libs
      - fontconfig
      - freetype
      - glib2
      - krb5-libs
      - libXrandr
      - sudo
      - systemd
      - xdg-desktop-portal
      - dejavu-sans-mono-fonts
    recommends:
      - (xdg-desktop-portal-gnome or xdg-desktop-portal-kde)
      - (gnome-keyring or kf6-kwallet)
rpm:
  compression: zstd
deb:
  compression: xz
