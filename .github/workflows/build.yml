name: Build Linux packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  packages:
    # Compile against the oldest supported glibc; newer hosts cannot lower it.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-suffix: ubuntu-22.04
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache python3-dev patchelf libffi-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 libxcb-shape0 libxrandr2 libegl1 libgl1 libdbus-1-3 libasound2 libglib2.0-0 libfontconfig1 libfreetype6 libpulse0 libgssapi-krb5-2
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Install nFPM
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv sync --frozen --group build --group helper
          package_version="$(uv run --no-sync python -c 'from desktop_afk_alert import __version__; print(__version__)')"
          test "$RELEASE_TAG" = "v$package_version"
      - name: Compile GUI and helper
        run: scripts/build.sh
      - name: Build .deb and .rpm
        run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-afk-alert-linux-x86_64
          retention-days: 7
          path: |
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compilation-reports
          retention-days: 7
          path: build/*-report.xml
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-afk-alert-linux-x86_64
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --draft --verify-tag --title "Desktop AFK Alert $RELEASE_TAG" --generate-notes
